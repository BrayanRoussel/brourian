# ==========================================
# TRANSPARENCIA Y APARIENCIA
# ==========================================
# Opacidad del fondo (0.85 = 85% opaco, ajusta entre 0.70 y 0.90 a tu gusto)
background_opacity 0.60

# Si usas un compositor como Picom con soporte para blur
background_blur 1

# Elimina las barras de título tradicionales para un look minimalista
hide_window_decorations yes
window_padding_width 10

# ==========================================
# TEMA PERSONALIZADO: DARK GREY & NEON RED
# ==========================================

# Fondo gris oscuro profundo / Texto gris claro-plata
background            #121316
foreground            #e2e4e9

# Cursor Rojo Neón
cursor                #ff003c
cursor_text_color     #121316
cursor_shape          beam
cursor_beam_thickness 1.8

# Selección de texto (Gris oscuro con resaltado rojo suave)
selection_background  #361923
selection_foreground  #ffffff

# Bordes de ventanas dentro de Kitty
active_border_color   #ff003c
inactive_border_color #1e2026

# TAB BAR (Pestañas estilo neón)
tab_bar_style         powerline
active_tab_background   #ff003c
active_tab_foreground   #121316
inactive_tab_background #1e2026
inactive_tab_foreground #8b909a

# ------------------------------------------
# PALETA ANSI (16 Colores)
# ------------------------------------------

# Negro / Gris Oscuro
color0  #1e2026
color8  #4d515d

# Rojo / Rojo Neón (Comandos clave, errores, prompt)
color1  #ff003c
color9  #ff3366

# Verde / Menta Neón (Salidas exitosas, git)
color2  #00f5d4
color10 #38ffe1

# Amarillo / Naranja Neón (Advertencias, comandos especiales)
color3  #ffb703
color11 #ffcb47

# Azul / Azul Neón
color4  #00b4d8
color12 #48cae4

# Magenta / Fucsia Neón (Directorios, acentos)
color5  #d6006e
color13 #ff2a8d

# Cían / Neón Hielo
color6  #00f0ff
color14 #70f3ff

# Blanco / Plata
color7  #e2e4e9
color15 #ffffff
