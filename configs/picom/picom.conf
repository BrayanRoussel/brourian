# =========================================================================
# PICOM v12.5 - WINE & BLACK ULTRA-MODERN EDITION
# =========================================================================

# --- Backend & Rendimiento ---
backend = "glx";
vsync = true;
unredir-if-possible = true; # Ahorro automático de CPU/RAM en pantalla completa
detect-rounded-corners = true;
detect-client-opacity = true;

# --- Esquinas Redondeadas Globales ---
corner-radius = 12;

# --- Sombras Elegantes ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#722F37"; # Sombra con un sutil reflejo vino para hacer juego

# --- Transparencias y Desvanecimientos ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 3;

inactive-opacity = 0.92;   # Ventanas inactivas sutilmente traslúcidas para dar profundidad
active-opacity = 1.0;      # Ventana activa totalmente sólida
frame-opacity = 1.0;

# --- ANIMACIONES AVANZADAS NATIVAS (v12.5) ---
animations = (
  {
    triggers = ["open", "show"];
    preset = "slide-in";
    direction = "up";
    duration = 0.22;
  },
  {
    triggers = ["close", "hide"];
    preset = "slide-out";
    direction = "down";
    duration = 0.18;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.15;
  }
);

# --- Desenfoque (Blur) Estilo Acrílico ---
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 4;

# --- Reglas Dinámicas y Exclusiones ---
rules = (
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
    inactive-opacity = 1.0;
  },
  {
    match = "class_g = 'Rofi'";
    fade = true;
    shadow = true;
    shadow-color = "#000000";
    corner-radius = 12;
    opacity = 0.96;
    blur-background = false;
    inactive-opacity = 0.96;
  },
  {
    match = "class_g = 'Polybar'";

    # vidrio tipo Hyprland
    corner-radius = 14;

    shadow = true;
    shadow-radius = 20;
    shadow-opacity = 0.35;
    shadow-offset-x = 0;
    shadow-offset-y = 8;
    shadow-color = "#000000";

    opacity = 0.92;
    inactive-opacity = 0.92;

    # blur acrílico
    blur-background = true;
    blur-method = "dual_kawase";
    blur-strength = 7;

    fade = true;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
    fade = false;
    blur-background = false;
    inactive-opacity = 1.0;
  }
);
